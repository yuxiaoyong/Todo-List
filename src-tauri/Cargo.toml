[package]
name = "todo-list"
version = "0.1.0"
description = "Todo List Desktop App"
authors = ["yuxiaoyong"]
license = "MIT"
edition = "2021"
default-run = "todo-list"

[lib]
name = "todo_list_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seed-demo"
path = "src/bin/seed-demo.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chinese-lunisolar-calendar = "0.2.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
jieba-rs = "0.7"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
pulldown-cmark = "0.12"
rfd = "0.15"
walkdir = "2"
zip = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }

[target.'cfg(windows)'.dependencies]
winrt-toast-reborn = "0.3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
